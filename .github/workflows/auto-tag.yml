name: Auto-tag on version bump

# When the workspace version on `main` advances past the latest existing
# `vX.Y.Z` tag, push the matching tag automatically. The push then triggers
# `release.yml`, which runs parity, builds binaries, drafts the GitHub
# Release, and publishes the npm wrapper.
#
# IMPORTANT: tag pushes signed by the default `GITHUB_TOKEN` do NOT trigger
# downstream `on: push: tags` workflows (GitHub Actions safety rule). For
# this auto-tag flow to actually fire `release.yml`, store a PAT (or
# fine-grained token) with `contents: write` on this repo as the
# `RELEASE_TAG_PAT` secret. Without it, the tag is created but `release.yml`
# does NOT run automatically — you'd have to push the tag again manually
# (`git push origin v$VERSION` from a developer machine) to trigger release.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'npm/codesmith/package.json'
  workflow_dispatch:

# Serialize: the existence check and the tag push are not atomic, so two
# near-simultaneous version-bump pushes would both observe exists=false and
# the loser's push would fail with a misleading red run.
concurrency:
  group: auto-tag
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Prefer PAT so the resulting tag push triggers release.yml.
          # Falls back to GITHUB_TOKEN, which will tag but NOT trigger.
          token: ${{ secrets.RELEASE_TAG_PAT || github.token }}

      - name: Read workspace version
        id: ver
        run: |
          # Section-scoped parse (not `grep | head -n1`, which grabs the
          # first `version = "…"` line anywhere in the file — a
          # [workspace.dependencies] or [patch] table would yield the wrong
          # string and tag the wrong version).
          v="$(awk '/^\[workspace\.package\]/{in_ws=1; next} /^\[/{in_ws=0} in_ws && /^version[[:space:]]*=[[:space:]]*"/{sub(/^[^"]*"/, ""); sub(/"[[:space:]]*(#.*)?$/, ""); print; exit}' Cargo.toml)"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Parsed workspace version '$v' is not valid semver" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $v"

      - name: Check whether tag already exists
        id: check
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
             || git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; nothing to do."
          else
            # Monotonicity: tag only when the version ADVANCES past the
            # latest existing tag. Without this, a rollback or out-of-order
            # merge (main at 1.3.0, hotfix 1.2.1 merges in) silently creates
            # a stale tag and fires the whole release pipeline — effectively
            # irreversible once artifacts are published.
            version="${TAG#v}"
            latest="$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -n1)"
            if [ -n "$latest" ]; then
              newest="$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)"
              if [ "$newest" != "$version" ]; then
                echo "::error::Workspace version $version does not advance past latest tag v$latest; refusing to tag." >&2
                exit 1
              fi
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist; will create."
          fi

      - name: Verify version consistency
        if: steps.check.outputs.exists == 'false'
        run: ./scripts/release/check-versions.sh

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          # Tolerate a lost race with a concurrent run: OK only if the tag
          # now exists remotely.
          git push origin "${TAG}" || {
            git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null \
              || exit 1
            echo "Tag ${TAG} was already pushed by a concurrent run; continuing."
          }
          echo "Pushed ${TAG}. release.yml should now run (requires RELEASE_TAG_PAT for trigger)."

      - name: Warn if PAT missing
        if: steps.check.outputs.exists == 'false' && env.HAS_PAT != 'true'
        env:
          HAS_PAT: ${{ secrets.RELEASE_TAG_PAT != '' }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          echo "::warning::RELEASE_TAG_PAT secret is not set. The tag was pushed using GITHUB_TOKEN, which does NOT trigger release.yml. Manually re-push the tag from a developer machine, or run 'gh workflow run release.yml --ref ${TAG}'."
