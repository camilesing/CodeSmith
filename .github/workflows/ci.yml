name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  versions:
    name: Version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch as of 2026-09-27; bump periodically
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Check version drift
        run: ./scripts/release/check-versions.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch as of 2026-09-27; bump periodically
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-features --locked -- -D warnings
      - name: Check provider registry drift
        run: python3 scripts/check-provider-registry.py
      - name: Check framework dependency direction
        run: python3 scripts/check-framework-deps.py
      - name: Check capability graph freshness
        run: python3 scripts/capability-graph.py --check
      - name: Linux clippy location
        run: echo "Linux clippy/test gates run on CNB for mirrored fix/*, rebrand/*, work/v*, and main branches."

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux workspace tests moved to CNB; GitHub keeps the platform
        # coverage CNB cannot provide.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        if: runner.os != 'Linux'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch as of 2026-09-27; bump periodically
        if: runner.os != 'Linux'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        if: runner.os != 'Linux'
        with:
          cache-bin: false
      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo test --workspace --all-features --locked
      - name: Lockfile drift guard
        if: runner.os != 'Linux'
        run: git diff --exit-code -- Cargo.lock
      - name: Run Offline Eval Harness
        if: runner.os != 'Linux'
        run: cargo run -p codesmith-tui --all-features -- eval
      - name: Linux test location
        if: runner.os == 'Linux'
        run: echo "Linux workspace tests run on CNB for mirrored first-party branches."

  npm-wrapper-smoke:
    name: npm wrapper smoke
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        if: runner.os != 'Linux'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch as of 2026-09-27; bump periodically
        if: runner.os != 'Linux'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os != 'Linux'
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        if: runner.os != 'Linux'
        with:
          cache-bin: false
      - name: Build wrapper binaries
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p codesmith-cli -p codesmith-tui
      - name: Smoke wrapper install and delegated entrypoints
        if: runner.os != 'Linux'
        run: node scripts/release/npm-wrapper-smoke.js
      - name: Linux smoke location
        if: runner.os == 'Linux'
        run: echo "Linux npm wrapper smoke runs on CNB for mirrored first-party branches."

  mobile-smoke:
    name: Mobile runtime smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch as of 2026-09-27; bump periodically
      - name: Install Linux system dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          cache-bin: false
      - name: Run mobile smoke tests
        run: ./scripts/mobile-smoke.sh

  # Check documentation builds without warnings
  docs:
    name: Documentation
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch as of 2026-09-27; bump periodically
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); retrying in 15s"
            sleep 15
          done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          cache-bin: false
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
