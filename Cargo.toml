[workspace]
members = [
    "crates/agent",
    "crates/agent-runtime",
    "crates/app-server",
    "crates/cli",
    "crates/config",
    "crates/core",
    "crates/execpolicy",
    "crates/extensions",
    "crates/extensions-fixture-dylib",
    "crates/hooks",
    "crates/index",
    "crates/mcp",
    "crates/protocol",
    "crates/providers",
    "crates/release",
    "crates/secrets",
    "crates/state",
    "crates/tools",
    "crates/tool-impls",
]
default-members = ["crates/cli", "crates/app-server"]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
# Rust 1.88 stabilized `let_chains` in `if`/`while` conditions, which the
# codebase relies on extensively. Cargo enforces this so users on older
# toolchains get a clear "package requires rustc 1.88+" error instead of a
# confusing E0658 from rustc.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/camilesing/CodeSmith"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.23.1"
bytes = "1"
async-trait = "0.1.89"
axum = { version = "0.8.5", features = ["json"] }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5"
# Internal workspace crates: path + version pins live here once; members
# inherit via `<dep>.workspace = true` so a version bump is a one-line change
# and `cargo publish` keeps its mandatory version key. check-versions.sh #3
# guards these pins against workspace-version drift.
codesmith-agent = { path = "crates/agent", version = "0.11.0" }
codesmith-agent-runtime = { path = "crates/agent-runtime", version = "0.11.0" }
codesmith-app-server = { path = "crates/app-server", version = "0.11.0" }
codesmith-config = { path = "crates/config", version = "0.11.0" }
codesmith-core = { path = "crates/core", version = "0.11.0" }
codesmith-execpolicy = { path = "crates/execpolicy", version = "0.11.0" }
codesmith-extensions = { path = "crates/extensions", version = "0.11.0" }
codesmith-hooks = { path = "crates/hooks", version = "0.11.0" }
codesmith-index = { path = "crates/index", version = "0.11.0" }
codesmith-mcp = { path = "crates/mcp", version = "0.11.0" }
codesmith-protocol = { path = "crates/protocol", version = "0.11.0" }
# `default-features = false` here (not in members): inheritance cannot
# override default-features, so the no-network `mock` provider stays out of
# every consumer; members add back the provider features they route to.
codesmith-providers = { path = "crates/providers", version = "0.11.0", default-features = false }
codesmith-release = { path = "crates/release", version = "0.11.0" }
codesmith-secrets = { path = "crates/secrets", version = "0.11.0" }
codesmith-state = { path = "crates/state", version = "0.11.0" }
codesmith-tools = { path = "crates/tools", version = "0.11.0" }
codesmith-tool-impls = { path = "crates/tool-impls", version = "0.11.0" }
dirs = "7.0.0"
# Test-fixture dylib (publish = false): hoisted so the extensions dev-dep
# inherits like every other internal path dep; carries no version pin.
extensions-fixture-dylib = { path = "crates/extensions-fixture-dylib" }
futures-util = "0.3.31"
inventory = "0.3"
libloading = "0.9.0"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "socks"] }
# rhai: script runtime for Mods (§F script mod layer). `sync` is a hard
# requirement — the `Handler`/`ToolDefinition` trait objects a mod registers
# must be Send+Sync; `serde` gives `rhai::serde::{to_dynamic, from_dynamic}`
# for the JSON-schema / tool-input conversions.
rhai = { version = "1.26", features = ["sync", "serde"] }
# rig: LLM provider framework. `reqwest`+`rustls` mirrors our TLS stack and
# unifies with the workspace `reqwest 0.13.x` (Cargo merges features into one
# build). `derive` is off — CodeSmith keeps its own `Tool`/`LlmClient` traits
# (Strategy A: rig is one swappable impl, not the framework vocabulary).
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# `rc` (Arc<T>/Rc<T> impls) is deliberately NOT workspace-wide: it is a
# footgun outside the crate whose types were audited for deep immutability
# (see codesmith-tools, which opts in locally for
# `ToolResult::canonical: Option<Arc<serde_json::Value>>`).
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.28"
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["full"] }
toml = "1.0.6"
# Format-preserving TOML editing (comments/whitespace/key order survive a
# single-key rewrite, e.g. settings_file's locale write).
toml_edit = "0.25"
sha2 = "0.11"
ignore = "0.4"
# ripgrep engine crates: `grep_files` walks with `ignore` and matches with
# `grep-regex`/`grep-matcher` so tool search gets ripgrep semantics
# (gitignore-aware walking, multi-line mode) without shelling out to `rg`.
grep-regex = "0.1"
grep-matcher = "0.1"
# tree-sitter: grammars bundle their own C sources and depend only on the
# stable `tree-sitter-language` ABI crate, so grammar versions float
# independently of the core crate pinned here.
tree-sitter = "0.26"
# Bash grammar doubles as the command-analysis parser for the approval
# gate (agent-runtime `bash_ast`), not just code retrieval — keep it a
# non-optional dependency there.
tree-sitter-bash = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tempfile = "3.16"
tokio-util = "0.7.16"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"
unicode-segmentation = "1.12"
uuid = { version = "1.11", features = ["v4"] }
