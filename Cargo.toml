[workspace]
members = [
    "crates/agent",
    "crates/agent-runtime",
    "crates/app-server",
    "crates/cli",
    "crates/config",
    "crates/core",
    "crates/execpolicy",
    "crates/extensions",
    "crates/extensions-fixture-dylib",
    "crates/hooks",
    "crates/index",
    "crates/mcp",
    "crates/protocol",
    "crates/providers",
    "crates/release",
    "crates/secrets",
    "crates/state",
    "crates/tools",
    "crates/tool-impls",
]
default-members = ["crates/cli", "crates/app-server"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
# Rust 1.88 stabilized `let_chains` in `if`/`while` conditions, which the
# codebase relies on extensively. Cargo enforces this so users on older
# toolchains get a clear "package requires rustc 1.88+" error instead of a
# confusing E0658 from rustc.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/camilesing/CodeSmith"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bytes = "1"
async-trait = "0.1.89"
axum = { version = "0.8.5", features = ["json"] }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0.0"
futures-util = "0.3.31"
inventory = "0.3"
libloading = "0.9.0"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "socks"] }
# rhai: script runtime for Mods (§F script mod layer). `sync` is a hard
# requirement — the `Handler`/`ToolDefinition` trait objects a mod registers
# must be Send+Sync; `serde` gives `rhai::serde::{to_dynamic, from_dynamic}`
# for the JSON-schema / tool-input conversions.
rhai = { version = "1.26", features = ["sync", "serde"] }
# rig: LLM provider framework. `reqwest`+`rustls` mirrors our TLS stack and
# unifies with the workspace `reqwest 0.13.x` (Cargo merges features into one
# build). `derive` is off — CodeSmith keeps its own `Tool`/`LlmClient` traits
# (Strategy A: rig is one swappable impl, not the framework vocabulary).
rig-core = { version = "0.39", default-features = false, features = ["reqwest", "rustls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
# `rc` (Arc<T>/Rc<T> impls) is deliberately NOT workspace-wide: it is a
# footgun outside the crate whose types were audited for deep immutability
# (see codesmith-tools, which opts in locally for
# `ToolResult::canonical: Option<Arc<serde_json::Value>>`).
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.28"
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.7"
sha2 = "0.10"
ignore = "0.4"
# ripgrep engine crates: `grep_files` walks with `ignore` and matches with
# `grep-regex`/`grep-matcher` so tool search gets ripgrep semantics
# (gitignore-aware walking, multi-line mode) without shelling out to `rg`.
grep-regex = "0.1"
grep-matcher = "0.1"
# tree-sitter: grammars bundle their own C sources and depend only on the
# stable `tree-sitter-language` ABI crate, so grammar versions float
# independently of the core crate pinned here.
tree-sitter = "0.25"
# Bash grammar doubles as the command-analysis parser for the approval
# gate (agent-runtime `bash_ast`), not just code retrieval — keep it a
# non-optional dependency there.
tree-sitter-bash = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tempfile = "3.16"
tokio-util = "0.7.16"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"
uuid = { version = "1.11", features = ["v4"] }
