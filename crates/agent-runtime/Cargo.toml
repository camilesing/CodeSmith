[package]
name = "codesmith-agent-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords = ["llm", "agent", "runtime", "sandbox", "tools"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "Unified agent execution core (engine, turn loop, compaction, sandbox) for CodeSmith"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
codesmith-agent = { path = "../agent", version = "0.1.0" }
codesmith-config = { path = "../config", version = "0.1.0" }
codesmith-extensions = { path = "../extensions", version = "0.1.0" }
codesmith-index = { path = "../index", version = "0.1.0" }
codesmith-secrets = { path = "../secrets", version = "0.1.0" }
codesmith-tools = { path = "../tools", version = "0.1.0" }
dirs.workspace = true
fd-lock = "4.0.4"
flate2 = "1.1"
futures-util = "0.3.31"
ignore = "0.4"
libc = "0.2"
multimap = "0.10.0"
portable-pty = "0.9"
wait-timeout = "0.2"
regex = "1.11"
reqwest = { workspace = true, features = ["stream", "form"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex = "2.0.1"
similar = "3"
starlark = "0.13.0"
tempfile = "3.16"
tar = "0.4"
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.16", features = ["io"] }
toml.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
unicode-properties.workspace = true
uuid.workspace = true
shellexpand = "3"
syn = { version = "3", default-features = false, features = ["parsing", "full"], optional = true }
# Runtime (non-proc-macro) syn spans only carry real line/column when
# proc-macro2 is built with `span-locations`; feature unification applies
# it to syn's copy too. Only needed by the parse gate.
proc-macro2 = { version = "1", optional = true, features = ["span-locations"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"], optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
tiny_http = "0.12"

[features]
# Real tokenizer support (HuggingFace `tokenizers`, BPE/Unigram via
# tokenizer.json files). Off by default for the portable core; hosts that
# want exact token counts (`[context].tokenizer_path`) enable this feature.
hf-tokenizer = ["dep:tokenizers"]
# Pre-write parse gate for file-editing tools (P0-1): Rust via `syn`,
# TOML/JSON via their standard parsers, plus rustfmt re-normalization.
# Hosts that never register write tools can drop the parser from their
# dependency graph by leaving this off — `parse_gate::gate` then compiles
# to a pass-through.
parse-gate = ["dep:syn", "dep:proc-macro2"]
