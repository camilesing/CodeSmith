[package]
name = "codesmith-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["llm", "agent", "ai", "models"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "Model/provider registry, LLM client trait, and wire models for the CodeSmith workspace architecture"

[dependencies]
anyhow.workspace = true
codesmith-config.workspace = true
# §E — leaf tool value-types (ToolResult/ToolError/ToolCapability/
# ApprovalRequirement). Cycle-free: tools -> protocol -> {serde, serde_json}.
codesmith-tools.workspace = true
futures-util.workspace = true
reqwest = { workspace = true }
serde.workspace = true
serde_json = { workspace = true }
tracing.workspace = true
tokio = { workspace = true }
# §F1 — ExtensionContext::signal() returns tokio_util::sync::CancellationToken
# (the codebase's standard cancel handle; host_executor.rs uses the same).
# The `sync` module (CancellationToken) is available on default features.
tokio-util.workspace = true
uuid.workspace = true
# §F1 — extension traits are implemented by extension authors in external
# crates; `#[async_trait]` is markedly friendlier for them than the manual
# `Pin<Box<dyn Future + Send + '_>>` pattern used by Tool/Callback/AgentExecutor.
async-trait.workspace = true
# §F1 — ExtensionError derive (`codesmith-tools` has thiserror too; agent
# previously had no thiserror dep because its error surface used anyhow).
thiserror.workspace = true
