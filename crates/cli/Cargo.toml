[package]
name = "codesmith-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["agent", "llm", "cli", "terminal", "coding"]
categories = ["command-line-utilities", "development-tools"]
license.workspace = true
repository.workspace = true
description = "Agentic terminal coding agent for open-weight models"

[[bin]]
name = "codesmith"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-stream = "0.3.6"
async-trait.workspace = true
base64.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
codesmith-agent = { path = "../agent", version = "0.9.0" }
codesmith-agent-runtime = { path = "../agent-runtime", version = "0.9.0", features = ["hf-tokenizer", "parse-gate"] }
codesmith-app-server = { path = "../app-server", version = "0.9.0" }
codesmith-config = { path = "../config", version = "0.9.0" }
codesmith-execpolicy = { path = "../execpolicy", version = "0.9.0" }
codesmith-extensions = { path = "../extensions", version = "0.9.0" }
codesmith-index = { path = "../index", version = "0.9.0", features = ["tree-sitter"] }
codesmith-mcp = { path = "../mcp", version = "0.9.0" }
codesmith-protocol = { path = "../protocol", version = "0.9.0" }
# Provider implementations (rig-backed). `default-features = false` keeps the
# no-network `mock` provider out of the binary; the four rig features select
# every provider the engine routes config to via `default_registry()`.
codesmith-providers = { path = "../providers", version = "0.9.0", default-features = false, features = ["openai", "anthropic", "deepseek", "openai-compat"] }
codesmith-release = { path = "../release", version = "0.9.0" }
codesmith-secrets = { path = "../secrets", version = "0.9.0" }
codesmith-state = { path = "../state", version = "0.9.0" }
codesmith-tools = { path = "../tools", version = "0.9.0" }
codesmith-tool-impls = { path = "../tool-impls", version = "0.9.0" }
colored = "3.0.0"
crossterm = "0.29"
dirs.workspace = true
dotenvy = "0.15.7"
fd-lock = "4.0.4"
flate2 = "1.1"
futures-util.workspace = true
ignore = "0.4"
multimap = "0.10.0"
pdf-extract = "0.12"
qrcode = "0.14"
regex = "1.11"
reqwest = { workspace = true, features = ["blocking", "json", "stream", "multipart", "form", "rustls", "http2", "gzip", "brotli"] }
rustyline = "18.0.1"
schemars = { version = "1.2.1", features = ["derive", "preserve_order"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shellexpand = "3"
shlex = "2.0.1"
similar = "3"
starlark = "0.14.2"
tar = "0.4"
tempfile.workspace = true
thiserror = "2.0"
tiny_http = "0.12"
tokio.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { workspace = true, features = ["io"] }
toml.workspace = true
tower-http = { version = "0.7", features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width = "0.2"
uuid = { version = "1.11", features = ["v4"] }
wait-timeout = "0.2"
zeroize = "1.8.2"

[dev-dependencies]
pretty_assertions = "1.4"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
