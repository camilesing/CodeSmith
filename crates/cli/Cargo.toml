[package]
name = "codesmith-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic terminal facade for open-source and open-weight coding models"

[[bin]]
name = "codesmith"
path = "src/main.rs"

# Short-form convenience alias — forwards to `codesmith` silently.
[[bin]]
name = "codew"
path = "src/bin/codew_legacy_shim.rs"

# Legacy CodeWhale alias — forwards to `codesmith` and prints a deprecation notice.
[[bin]]
name = "codewhale"
path = "src/bin/codewhale_legacy_shim.rs"

# Legacy alias — forwards to `codesmith` and prints a deprecation notice.
# Will be removed in v0.9.0.
[[bin]]
name = "deepseek"
path = "src/bin/deepseek_legacy_shim.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
codesmith-agent = { path = "../agent", version = "0.8.48" }
codesmith-app-server = { path = "../app-server", version = "0.8.48" }
codesmith-config = { path = "../config", version = "0.8.48" }
codesmith-execpolicy = { path = "../execpolicy", version = "0.8.48" }
codesmith-mcp = { path = "../mcp", version = "0.8.48" }
codesmith-release = { path = "../release", version = "0.8.48" }
codesmith-secrets = { path = "../secrets", version = "0.8.48" }
codesmith-state = { path = "../state", version = "0.8.48" }
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
semver.workspace = true
tokio.workspace = true
sha2.workspace = true
tempfile = "3.16"
tracing.workspace = true

[dev-dependencies]
