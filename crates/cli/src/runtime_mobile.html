<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CodeSmith Mobile</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #181b1f;
      --panel-2: #20242a;
      --line: #323840;
      --text: #f4f1e8;
      --muted: #a8a49a;
      --accent: #48c2a8;
      --accent-2: #c89543;
      --danger: #e86458;
      --ok: #76c46b;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
      background: rgba(16, 18, 20, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 740;
    }
    main {
      display: grid;
      gap: 12px;
      padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
    }
    section {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      min-height: 46px;
    }
    .body { padding: 12px; }
    .grid { display: grid; gap: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }
    button, input, textarea, select {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      letter-spacing: 0;
    }
    button {
      min-height: 40px;
      padding: 8px 11px;
      font-weight: 680;
      cursor: pointer;
    }
    button.primary {
      background: #173d36;
      border-color: #2a8b77;
    }
    button.warn {
      background: #3c2b14;
      border-color: #8b682b;
    }
    button.danger {
      background: #421f1d;
      border-color: #9b4038;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
    }
    textarea {
      min-height: 96px;
      resize: vertical;
    }
    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 10px;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
    }
    label.toggle input { width: auto; }
    .status {
      min-height: 38px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #121518;
      border: 1px solid var(--line);
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--danger); }
    .status.warn { color: var(--accent-2); }
    #threads {
      display: grid;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
    }
    .thread {
      width: 100%;
      padding: 10px;
      text-align: left;
      border-radius: 8px;
      background: var(--panel-2);
    }
    .thread.active { border-color: var(--accent); }
    .thread-title {
      font-weight: 720;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    #events {
      display: grid;
      gap: 8px;
      max-height: 54vh;
      overflow: auto;
      padding-right: 2px;
    }
    .event {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121518;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .event.agent { border-color: #357969; }
    .event.tool { border-color: #8b682b; }
    .event.error { border-color: #9b4038; }
    .event.ok { border-color: #4d8048; }
    .approval-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 9px;
    }
    .approval-actions button {
      flex: 0 0 auto;
      min-width: 84px;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
    }
    @media (min-width: 900px) {
      main {
        grid-template-columns: 330px minmax(0, 1fr);
        align-items: start;
      }
      section.chat {
        grid-column: 2;
        grid-row: 1 / span 3;
      }
      #threads { max-height: 420px; }
      #events { max-height: calc(100vh - 150px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>CodeSmith Mobile</h1>
    <button id="refresh" title="Refresh threads">Refresh</button>
  </header>

  <main>
    <section>
      <div class="head">
        <strong>Connection</strong>
        <button id="save-token">Save</button>
      </div>
      <div class="body grid">
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Runtime token">
        <div id="conn" class="status">Not connected</div>
      </div>
    </section>

    <section>
      <div class="head">
        <strong>Threads</strong>
        <button id="new-thread" class="primary">New</button>
      </div>
      <div class="body"><div id="threads"></div></div>
    </section>

    <section class="chat">
      <div class="head">
        <strong id="active-title">No thread selected</strong>
        <span id="event-count" class="meta">0 events</span>
      </div>
      <div class="body"><div id="events"></div></div>
    </section>

    <section>
      <div class="head">
        <strong>Composer</strong>
        <button id="interrupt" class="danger">Interrupt</button>
      </div>
      <div class="body grid">
        <textarea id="prompt" spellcheck="true" placeholder="Message"></textarea>
        <div class="row">
          <label class="toggle"><input id="allow-shell" type="checkbox"> shell</label>
          <label class="toggle"><input id="auto-approve" type="checkbox"> auto</label>
          <label class="toggle"><input id="remember-approval" type="checkbox"> remember</label>
        </div>
        <div class="row">
          <button id="send" class="primary">Send</button>
          <button id="steer" class="warn">Steer</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = {
      threadId: "",
      activeTurnId: "",
      source: null,
      eventCount: 0,
      sinceSeq: 0,
      reconnectMs: 500,
      // approval id -> live Allow/Deny button container, so a later
      // decided/timeout event (live or replayed) can settle it.
      approvals: new Map()
    };

    function setStatus(message, tone = "") {
      const el = $("conn");
      el.textContent = message;
      el.className = "status" + (tone ? " " + tone : "");
    }

    function token() {
      return $("token").value;
    }

    function takeTokenFromUrl() {
      const params = new URLSearchParams(location.search);
      const urlToken = params.get("token");
      if (!urlToken) return;
      // sessionStorage, not localStorage: this token authorizes thread
      // creation, shell-enabling turns, and approval Allow decisions —
      // full agent control — so it must not outlive the tab session or
      // stay readable to injected scripts across sessions. (The deep-link
      // ?token= flow itself is a known limitation: the value still
      // touches server/proxy access logs before replaceState strips it.)
      sessionStorage.setItem("codesmith_runtime_token", urlToken);
      params.delete("token");
      const qs = params.toString();
      history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
    }

    function headers(extra = {}) {
      const out = Object.assign({ "Content-Type": "application/json" }, extra);
      if (token()) out.Authorization = "Bearer " + token();
      return out;
    }

    async function api(path, options = {}) {
      const res = await fetch(path, Object.assign({}, options, {
        headers: headers(options.headers || {})
      }));
      if (!res.ok) {
        let detail = await res.text();
        try {
          const parsed = JSON.parse(detail);
          detail = parsed.error?.message || detail;
        } catch (_) {}
        throw new Error(detail || ("HTTP " + res.status));
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function eventPayload(data) {
      return data && typeof data === "object" && "payload" in data ? data.payload : data;
    }

    function eventText(name, data) {
      const payload = eventPayload(data) || {};
      if (name === "item.delta") return payload.delta || "";
      if (name === "item.started") {
        const tool = payload.tool;
        if (tool) return "Tool started: " + tool.name + "\n" + JSON.stringify(tool.input || {}, null, 2);
      }
      if (name === "item.completed" || name === "item.failed") {
        const item = payload.item || {};
        return (name === "item.completed" ? "Completed: " : "Failed: ") + (item.summary || item.kind || "");
      }
      if (name === "approval.required") {
        return "Approval required: " + (payload.tool_name || "") + "\n" + (payload.description || "");
      }
      if (name === "approval.decided") {
        return "Approval " + (payload.decision || "decided") + ": " + (payload.approval_id || "");
      }
      if (name === "approval.timeout") {
        return "Approval timed out: " + (payload.approval_id || "");
      }
      if (name === "sandbox.denied") {
        return "Sandbox denied: " + (payload.tool_name || "") + "\n" + (payload.reason || "");
      }
      if (name === "turn.lifecycle") return "Turn status: " + (payload.status || "");
      if (name === "turn.completed") return "Turn completed";
      if (name === "coherence.state") return JSON.stringify(payload, null, 2);
      return JSON.stringify(payload, null, 2);
    }

    function approvalInfo(name, data) {
      if (name !== "approval.required") return null;
      const payload = eventPayload(data) || {};
      const approvalId = payload.approval_id || payload.id;
      if (!approvalId) return null;
      return { id: approvalId };
    }

    async function decideApproval(approvalId, decision, container) {
      for (const button of container.querySelectorAll("button")) button.disabled = true;
      const remember = $("remember-approval").checked;
      try {
        const result = await api("/v1/approvals/" + encodeURIComponent(approvalId), {
          method: "POST",
          body: JSON.stringify({ decision, remember })
        });
        const decided = result?.decision ?? decision;
        settleApprovalContainer(container, "Decision sent: " + decided);
      } catch (err) {
        for (const button of container.querySelectorAll("button")) button.disabled = false;
        throw err;
      }
    }

    const MAX_EVENT_NODES = 400;

    function settleApprovalContainer(container, label) {
      container.replaceChildren();
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = label;
      container.appendChild(meta);
    }

    function settleApproval(approvalId, label) {
      const container = state.approvals.get(approvalId);
      if (!container || !container.isConnected) return;
      settleApprovalContainer(container, label);
      state.approvals.delete(approvalId);
    }

    function appendEvent(name, data) {
      // A later decided/timeout event settles the matching approval block —
      // without this, replaying a thread's backlog (since_seq=0 on every
      // thread switch) re-renders live Allow/Deny buttons for approvals
      // that were already decided.
      if (name === "approval.decided" || name === "approval.timeout") {
        const payload = eventPayload(data) || {};
        if (payload.approval_id) {
          settleApproval(
            payload.approval_id,
            name === "approval.timeout"
              ? "Approval timed out"
              : "Approval " + (payload.decision || "decided")
          );
        }
      }
      const text = eventText(name, data);
      if (!text) return;
      const events = $("events");
      state.eventCount += 1;
      $("event-count").textContent = state.eventCount + " events";
      // Coalesce consecutive stream deltas into the previous node instead of
      // materializing one styled node per chunk.
      if (name === "item.delta" && events.lastElementChild?.dataset?.deltas === "1") {
        events.lastElementChild.appendChild(document.createTextNode(text));
        events.scrollTop = events.scrollHeight;
        return;
      }
      const item = document.createElement("div");
      item.className = "event";
      if (name === "item.delta") {
        item.classList.add("agent");
        item.dataset.deltas = "1";
      }
      if (name === "item.started" || name.includes("tool")) item.classList.add("tool");
      if (name.includes("failed") || name.includes("denied") || name.includes("timeout")) item.classList.add("error");
      if (name === "turn.completed" || name === "approval.decided") item.classList.add("ok");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = name;
      item.appendChild(meta);
      item.appendChild(document.createTextNode(text));

      const approval = approvalInfo(name, data);
      if (approval) {
        const actions = document.createElement("div");
        actions.className = "approval-actions";
        const allow = document.createElement("button");
        allow.className = "primary";
        allow.textContent = "Allow";
        allow.onclick = () => decideApproval(approval.id, "allow", actions)
          .catch((err) => setStatus(err.message, "bad"));
        const deny = document.createElement("button");
        deny.className = "danger";
        deny.textContent = "Deny";
        deny.onclick = () => decideApproval(approval.id, "deny", actions)
          .catch((err) => setStatus(err.message, "bad"));
        actions.appendChild(allow);
        actions.appendChild(deny);
        item.appendChild(actions);
        state.approvals.set(approval.id, actions);
      }

      events.appendChild(item);
      while (events.children.length > MAX_EVENT_NODES) {
        events.removeChild(events.firstElementChild);
      }
      events.scrollTop = events.scrollHeight;
    }

    async function loadThreads() {
      const threads = await api("/v1/threads/summary?limit=60&include_archived=false");
      const list = $("threads");
      list.innerHTML = "";
      if (!threads || !threads.length) {
        list.innerHTML = "<div class='empty'>No active threads.</div>";
        return;
      }
      for (const thread of threads) {
        const el = document.createElement("button");
        el.className = "thread" + (thread.id === state.threadId ? " active" : "");
        const title = document.createElement("div");
        title.className = "thread-title";
        title.textContent = thread.title || thread.id;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = (thread.mode || "") + " / " + (thread.model || "");
        el.appendChild(title);
        el.appendChild(meta);
        el.onclick = () => selectThread(thread.id, thread.title || thread.id);
        list.appendChild(el);
      }
    }

    async function newThread() {
      const thread = await api("/v1/threads", {
        method: "POST",
        body: JSON.stringify({
          mode: "agent",
          allow_shell: $("allow-shell").checked,
          trust_mode: false,
          auto_approve: $("auto-approve").checked
        })
      });
      await selectThread(thread.id, thread.title || thread.id);
    }

    async function selectThread(id, title) {
      state.threadId = id;
      state.activeTurnId = "";
      state.eventCount = 0;
      state.sinceSeq = 0;
      state.reconnectMs = 500;
      state.approvals.clear();
      $("event-count").textContent = "0 events";
      $("active-title").textContent = title || id;
      $("events").innerHTML = "";
      if (state.source) state.source.abort();
      connectEvents(id);
      await loadThreads();
    }

    // SSE over fetch instead of EventSource: EventSource cannot set the
    // Authorization header, so it forced a `?token=` query param that leaked
    // the bearer token into server/proxy access logs on every auto-reconnect.
    // Here the token travels in the header and reconnects resume from the
    // last seen event seq.
    // Same event-name filter the EventSource listeners used to register.
    const EVENT_NAMES = [
      "thread.started", "turn.started", "turn.lifecycle", "turn.steered",
      "turn.interrupt_requested", "turn.completed", "item.started",
      "item.delta", "item.completed", "item.failed", "approval.required",
      "approval.decided", "approval.timeout", "sandbox.denied",
      "coherence.state"
    ];

    function handleEventFrame(name, dataStr) {
      if (!EVENT_NAMES.includes(name)) return;
      let data = {};
      try { data = JSON.parse(dataStr || "{}"); } catch (_) {}
      if (typeof data.seq === "number" && data.seq > state.sinceSeq) {
        state.sinceSeq = data.seq;
      }
      if (data.turn_id) state.activeTurnId = data.turn_id;
      appendEvent(name, data);
    }

    async function connectEvents(id) {
      const controller = new AbortController();
      state.source = controller;
      const streamHeaders = {};
      if (token()) streamHeaders.Authorization = "Bearer " + token();
      let delay = state.reconnectMs || 500;
      try {
        const res = await fetch(
          "/v1/threads/" + encodeURIComponent(id) +
            "/events?since_seq=" + (state.sinceSeq || 0),
          { headers: streamHeaders, signal: controller.signal }
        );
        if (!res.ok || !res.body) {
          if (res.status >= 400 && res.status < 500) {
            // 401/403/404 cannot be fixed by retrying — surface the status
            // instead of masking it behind reconnect backoff forever.
            setStatus("Event stream error " + res.status + " — check the access token", "bad");
            return;
          }
          throw new Error("event stream HTTP " + res.status);
        }
        setStatus("Connected", "ok");
        delay = 500;
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        // SSE lines may arrive CRLF- or CR-terminated (spec-legal; some
        // mobile proxies rewrite them), so normalize before frame splitting.
        const takeFrames = () => {
          let sep;
          while ((sep = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);
            let eventName = "message";
            const dataLines = [];
            for (const line of frame.split("\n")) {
              if (line.startsWith(":")) continue;
              const colon = line.indexOf(":");
              const field = colon === -1 ? line : line.slice(0, colon);
              const fieldValue = colon === -1 ? "" : line.slice(colon + 1).replace(/^ /, "");
              if (field === "event") eventName = fieldValue;
              else if (field === "data") dataLines.push(fieldValue);
            }
            if (dataLines.length) handleEventFrame(eventName, dataLines.join("\n"));
          }
        };
        for (;;) {
          const { done, value: chunk } = await reader.read();
          if (done) break;
          buffer += decoder.decode(chunk, { stream: true }).replace(/\r\n?/g, "\n");
          takeFrames();
        }
        // Flush the decoder's pending multibyte tail and dispatch a final
        // frame that arrived without a terminating blank line.
        buffer += decoder.decode().replace(/\r\n?/g, "\n");
        takeFrames();
        // Stream ended cleanly (server-side timeout) — reconnect.
        throw new Error("event stream ended");
      } catch (err) {
        if (controller.signal.aborted || state.threadId !== id) return;
        setStatus("Event stream disconnected — reconnecting", "warn");
        state.reconnectMs = Math.min(delay * 2, 15000);
        setTimeout(() => {
          if (!controller.signal.aborted && state.threadId === id) {
            connectEvents(id).catch(() => {});
          }
        }, state.reconnectMs);
      }
    }

    async function sendPrompt() {
      if (!state.threadId) await newThread();
      const prompt = $("prompt").value.trim();
      if (!prompt) return;
      const res = await api("/v1/threads/" + encodeURIComponent(state.threadId) + "/turns", {
        method: "POST",
        body: JSON.stringify({
          prompt,
          allow_shell: $("allow-shell").checked,
          trust_mode: false,
          auto_approve: $("auto-approve").checked
        })
      });
      state.activeTurnId = res.turn?.id || state.activeTurnId;
      $("prompt").value = "";
      await loadThreads();
    }

    async function steerTurn() {
      if (!state.threadId || !state.activeTurnId) throw new Error("No active turn");
      const prompt = $("prompt").value.trim();
      if (!prompt) return;
      await api(
        "/v1/threads/" + encodeURIComponent(state.threadId) +
        "/turns/" + encodeURIComponent(state.activeTurnId) + "/steer",
        { method: "POST", body: JSON.stringify({ prompt }) }
      );
      $("prompt").value = "";
    }

    async function interruptTurn() {
      if (!state.threadId || !state.activeTurnId) throw new Error("No active turn");
      await api(
        "/v1/threads/" + encodeURIComponent(state.threadId) +
        "/turns/" + encodeURIComponent(state.activeTurnId) + "/interrupt",
        { method: "POST", body: "{}" }
      );
    }

    // Double-tapping Send/Steer on mobile used to fire two concurrent
    // POSTs with the same prompt; disable the button for the flight.
    function withBusy(button, fn) {
      return async () => {
        if (button.disabled) return;
        button.disabled = true;
        try {
          await fn();
        } catch (err) {
          setStatus(err.message, "bad");
        } finally {
          button.disabled = false;
        }
      };
    }

    async function boot() {
      takeTokenFromUrl();
      $("token").value = sessionStorage.getItem("codesmith_runtime_token") || "";
      $("save-token").onclick = async () => {
        sessionStorage.setItem("codesmith_runtime_token", token());
        await loadThreads().catch((err) => setStatus(err.message, "bad"));
      };
      $("refresh").onclick = () => loadThreads().catch((err) => setStatus(err.message, "bad"));
      $("new-thread").onclick = () => newThread().catch((err) => setStatus(err.message, "bad"));
      $("send").onclick = withBusy($("send"), sendPrompt);
      $("steer").onclick = withBusy($("steer"), steerTurn);
      $("interrupt").onclick = () => interruptTurn().catch((err) => setStatus(err.message, "bad"));
      await loadThreads();
      setStatus("Connected", "ok");
    }

    boot().catch((err) => setStatus(err.message, "bad"));
  </script>
</body>
</html>
