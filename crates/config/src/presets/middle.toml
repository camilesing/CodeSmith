# Middle — the factory default. Simple plus the high-value, low-cost
# features: cross-session memory, lazy code index, LSP diagnostics,
# workspace snapshots, sub-agents, web search, MCP, tool search on demand
# (the request carries the resident core; the declared-deferred long tail
# is discoverable through `tool_search`), and the strong-brain
# auto router (heavy tier classifies, quality-first). Experimental
# seams (context manager, capacity, KOD, vision, agent teams,
# coordinator) stay off. Set [auto] cost_saving = true in your config.toml
# to restore the cheap-model cost-saving router (in a copied preset file
# the key is the top-level auto_cost_saving). Keep `description` below in
# sync with this posture.
name = "middle"
description = "Factory default: high-value features on (memory, index, LSP, snapshots, sub-agents, web search, MCP, project context pack) with the quality-first strong-brain auto router and tool-search-on-demand; network audit on; context manager, capacity, KOD, vision, agent teams, and coordinator stay off."
max_subagents = 10
index_enabled = true
lsp_enabled = true
lsp_include_warnings = false
snapshots_enabled = true
memory_enabled = true
memory_kod_enabled = false
context_enabled = false
context_project_pack = true
capacity_enabled = false
auto_cost_saving = false
network_audit = true
strict_tool_mode = false
tools_progressive_disclosure = true

[features]
shell_tool = true
subagents = true
web_search = true
apply_patch = true
mcp = true
exec_policy = true
vision_model = false
knowledge_on_demand = false
agent_teams = false
coordinator_mode = false
file_freshness = true
