[package]
name = "extensions-fixture-dylib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["llm", "agent"]
categories = ["development-tools"]
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
codesmith-agent.workspace = true
codesmith-tools.workspace = true
serde_json.workspace = true
# The dylib-tier turn-executor seam: the fixture registers a generation-
# bound loop at configure() time (agent-runtime is implementation-group
# territory for a dylib fixture — a downstream dylib links it the same way).
codesmith-agent-runtime.workspace = true

[dev-dependencies]
# (no extra dev-dependencies — the seam proof tests use the lib's own deps)
