[package]
name = "codesmith-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["extensions", "plugins", "agent"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "Extension runtime: discovery, loading, event dispatch, stale-context guard for CodeSmith extensions"
# Packaging hygiene: the path-only dev-dependency on the unpublished
# `extensions-fixture-dylib` is stripped from the packaged manifest by
# modern Cargo, but without an allow-list any fixture data or generated
# artifacts that later land in this directory would be packaged on publish.
include = ["src/**", "Cargo.toml", "build.rs"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
codesmith-agent.workspace = true
codesmith-tools.workspace = true
fd-lock = "4.0.4"
inventory.workspace = true
rhai.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
libloading.workspace = true

[dev-dependencies]
extensions-fixture-dylib.workspace = true
