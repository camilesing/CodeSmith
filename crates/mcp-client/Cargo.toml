[package]
name = "codesmith-mcp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["mcp", "model-context-protocol", "client"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "MCP client pool for CodeSmith: stdio/HTTP/SSE/WS transports, tool discovery, OAuth"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
codesmith-agent.workspace = true
codesmith-config.workspace = true
codesmith-session.workspace = true
codesmith-sandbox.workspace = true
codesmith-secrets.workspace = true
futures-util.workspace = true
libc = "0.2"
reqwest = { workspace = true, features = ["json", "stream", "form"] }
serde.workspace = true
shlex.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiny_http = "0.12"
