[package]
name = "codesmith-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords = ["secrets", "keyring", "security"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "Secret storage backends (OS keyring with file fallback) for the CodeSmith workspace"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3.16"
