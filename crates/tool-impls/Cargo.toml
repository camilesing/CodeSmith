[package]
name = "codesmith-tool-impls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["llm", "agent", "tools"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "Model-visible tool implementations for CodeSmith (concrete impl ToolSpec blocks)"

[dependencies]
codesmith-agent.workspace = true
codesmith-agent-runtime = { workspace = true, features = ["parse-gate"] }
codesmith-config.workspace = true
codesmith-index.workspace = true
codesmith-tools.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
libc = "0.2"
regex = "1.11"
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex = "2.0.1"
similar = "3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
toml.workspace = true
ignore.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
base64.workspace = true
pdf-extract = "0.12"
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile.workspace = true
wiremock = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }
