[package]
name = "codesmith-tool-impls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords = ["llm", "agent", "tools"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "Model-visible tool implementations for CodeSmith (concrete impl ToolSpec blocks)"

[dependencies]
codesmith-agent = { path = "../agent", version = "0.1.0" }
codesmith-agent-runtime = { path = "../agent-runtime", version = "0.1.0" }
codesmith-config = { path = "../config", version = "0.1.0" }
codesmith-index = { path = "../index", version = "0.1.0" }
codesmith-tools = { path = "../tools", version = "0.1.0" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
libc = "0.2"
regex = "1.11"
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex = "2.0.1"
similar = "3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
toml.workspace = true
ignore.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
base64 = "0.23.1"
pdf-extract = "0.12"
tokio-util = { version = "0.7.16", features = ["io"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.16"
wiremock = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }
