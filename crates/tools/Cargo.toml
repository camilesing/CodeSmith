[package]
name = "codesmith-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["llm", "agent", "tools"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
description = "Tool invocation lifecycle, schema validation, and scheduler parallelism for the CodeSmith workspace architecture"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
codesmith-protocol.workspace = true
# `rc` is opted in locally (not workspace-wide): `ToolResult::canonical:
# Option<Arc<serde_json::Value>>` keeps event-fanout clones O(1), and this
# crate's Arc/Rc deserialize targets are audited for deep immutability (no
# Mutex/RefCell pointees) as they cross provider/mod payload boundaries.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
# Local (non-inherited) tokio: workspace inheritance can only ADD features,
# so inheriting would impose the workspace-level `full` surface (net,
# process, fs, signal, …) on any downstream consumer of this publishable
# crate. The audited local need (src + tests/parity_tools.rs) is `rt`
# (spawn/task_local), `sync`, `time`, and `macros` (#[tokio::test],
# select!).
tokio = { version = "1.49.0", features = ["rt", "sync", "time", "macros"] }
uuid.workspace = true
