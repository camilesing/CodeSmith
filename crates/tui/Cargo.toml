[package]
name = "codesmith-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal UI for open-source and open-weight coding models"
default-run = "codesmith-tui"

[features]
default = ["tui", "json", "toml"]
tui = ["dep:schemaui", "schemaui/tui", "json", "toml"]
web = ["dep:schemaui", "schemaui/web", "json", "toml"]
json = ["schemaui/json"]
toml = ["schemaui/toml"]

[[bin]]
name = "codesmith-tui"
path = "src/main.rs"

# Legacy CodeWhale alias — forwards to `codesmith-tui` and prints a deprecation notice.
[[bin]]
name = "codewhale-tui"
path = "src/bin/codewhale_tui_legacy_shim.rs"

# Legacy alias — forwards to `codesmith-tui` and prints a deprecation
# notice. Will be removed in v0.9.0.
[[bin]]
name = "deepseek-tui"
path = "src/bin/deepseek_tui_legacy_shim.rs"

[dependencies]
anyhow = "1.0.100"
arboard = "3.4"
codesmith-agent = { path = "../agent", version = "0.8.48" }
codesmith-agent-runtime = { path = "../agent-runtime", version = "0.8.48" }
codesmith-config = { path = "../config", version = "0.8.48" }
codesmith-index = { path = "../index", version = "0.8.48", features = ["tree-sitter"] }
codesmith-extensions = { path = "../extensions", version = "0.8.48" }
codesmith-protocol = { path = "../protocol", version = "0.8.48" }
# Provider implementations (rig-backed). `default-features = false` keeps the
# no-network `mock` provider out of the binary; the four rig features select
# every provider the engine routes config to via `default_registry()`. DeepSeek
# now also goes through the rig `DeepSeekFactory` (its `reasoning_content`
# replay is handled by the adapter's `shape_messages` + rig's faithful
# `reasoning_content` serialization — ROADMAP §A1 / §D1), so `deepseek` is on.
codesmith-providers = { path = "../providers", version = "0.8.48", default-features = false, features = ["openai", "anthropic", "deepseek", "openai-compat"] }
codesmith-release = { path = "../release", version = "0.8.48" }
codesmith-secrets = { path = "../secrets", version = "0.8.48" }
codesmith-tools = { path = "../tools", version = "0.8.48" }
codesmith-tool-impls = { path = "../tool-impls", version = "0.8.48" }
schemaui = { version = "0.12.0", default-features = false, optional = true }
async-stream = "0.3.6"
async-trait = "0.1"
base64 = "0.22.1"
axum = { version = "0.8.4", features = ["json"] }
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5"
colored = "3.0.0"
crossterm = "0.28"
dotenvy = "0.15.7"
dirs = "6.0.0"
fd-lock = "4.0.4"
futures-util = "0.3.31"
ratatui = "0.30"
regex = "1.11"
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "json", "stream", "multipart", "form", "rustls", "http2", "gzip", "brotli"] }
qrcode = { version = "0.14", default-features = false }
similar = "2"
rustyline = "15.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
schemars = { version = "1.2.1", features = ["derive", "preserve_order"] }
shellexpand = "3"
toml = "0.9.7"
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.16", features = ["io"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.16"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
wait-timeout = "0.2"
multimap = "0.10.0"
shlex = "1.3.0"
starlark = "0.13.0"
tiny_http = "0.12"
portable-pty = "0.9"
zeroize = "1.8.2"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
pdf-extract = "0.7"
tar = "0.4"
flate2 = "1.1"
sha2 = "0.10"

[dev-dependencies]
wiremock = "0.6"
pretty_assertions = "1.4"
vt100 = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
