[package]
name = "codesmith-desktop"
version = "0.1.0"
description = "CodeSmith Desktop — Tauri shell over the vendored DSH client UI"
edition = "2021"

# Standalone cargo project: the root workspace lists members explicitly and
# does not include this directory; the empty [workspace] table keeps cargo
# from attaching us to it when building from inside the repo tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
