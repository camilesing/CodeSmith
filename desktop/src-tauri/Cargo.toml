[package]
name = "codesmith-desktop"
version = "0.1.0"
description = "CodeSmith Desktop — Tauri shell over the vendored client UI"
edition = "2021"

# Standalone cargo project: the root workspace lists members explicitly and
# does not include this directory; the empty [workspace] table keeps cargo
# from attaching us to it when building from inside the repo tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
dirs = "6"
which = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "sync", "time", "io-util", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
codegen-units = 1
lto = true
