<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSmith</title>
    <script>
      /* Inline __ModuleLoader__ queue facade — verbatim from the upstream
         bootInjections() (packages/client/modules/src/index.ts), with the
         vendored package id. The blocking bootstrap script below registers
         the client-modules bundle into this queue before any module script
         runs. */
      (()=>{
        const pendingQueue=[]
        window.__ModuleLoader__={
          mode:"queue",
          pendingQueue,
          load(registration){pendingQueue.push(registration)},
          create(options){
            if(this.mode!=="queue")throw new Error("client-modules: window.__ModuleLoader__.create called after module-system boot")
            const index=pendingQueue.findIndex(registration=>registration.id==="@codesmith/client-modules")
            const registration=pendingQueue[index]
            if(registration===undefined)throw new Error("client-modules: HTML did not preload @codesmith/client-modules/client.js")
            pendingQueue.splice(index,1)
            const exports=registration.factory(specifier=>{
              throw new Error('client-modules: @codesmith/client-modules/client.js requested external "'+specifier+'" before the module system existed')
            })
            if(typeof exports!=="object"||exports===null||typeof exports.createClientModuleSystem!=="function"||typeof exports.apply!=="function"){
              throw new Error("client-modules: @codesmith/client-modules/client.js did not export the bootstrap module face")
            }
            return exports.createClientModuleSystem(this,{id:registration.id,exports},options)
          }
        }
      })()
    </script>
    <!-- Blocking bootstrap batch: the module-system implementation. rev is
         rewritten by gen_boot_graph.mjs output (boot-graph.generated.ts);
         keep this URL in sync with it. -->
    <script src="plugins/@codesmith/client-modules/client.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
