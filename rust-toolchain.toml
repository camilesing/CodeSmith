# Project toolchain pin.
#
# CodeSmith targets stable Rust (MSRV 1.88, edition 2024) and uses no nightly
# features, so a stable channel is the correct, reproducible target. This pin
# also satisfies the workspace's serde_json 1.0.150, whose dep `zmij`
# needs `core::hint::select_unpredictable`, and the
# codebase uses `let`-chains — both stabilized in 1.88 stable but absent from
# the older `nightly-2025-04-04` that was the previous system default.
#
# Scope: this file is the single source of truth for the build toolchain.
# rustup resolves it for every cargo/rustc invocation — local AND CI: the
# `dtolnay/rust-toolchain` step in CI only supplies rustup (plus a stable
# toolchain its `components:` inputs attach to), and the rustup proxies in
# later steps resolve THIS pin instead, auto-installing it on first use
# (CI logs confirm: "toolchain '1.90.0' ... is currently in use (overridden
# by 'rust-toolchain.toml')" while the installed stable sits unused; the
# nightly/release workflows' "Add build target to pinned toolchain" steps
# depend on exactly this). Local and CI builds are therefore the same
# version by construction — a lint new in a later stable cannot fail CI
# while passing locally.
#
# To move to a newer stable, bump this version (MSRV 1.88 still applies);
# no workflow edit is needed. To develop on nightly instead, replace
# `channel` with the desired nightly date after verifying it builds this
# crate graph.

[toolchain]
channel = "1.90.0"
# Auto-install pulls these in too; without them a fresh local environment
# gets a minimal toolchain and `cargo fmt --check` fails on a missing
# cargo-fmt (CI installs its own components, see above).
components = ["rustfmt", "clippy"]
