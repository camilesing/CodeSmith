# Project toolchain pin.
#
# CodeSmith targets stable Rust (MSRV 1.88, edition 2024) and uses no nightly
# features, so a stable channel is the correct, reproducible target. This pin
# also satisfies the workspace's serde_json 1.0.150, whose dep `zmij`
# needs `core::hint::select_unpredictable`, and the
# codebase uses `let`-chains — both stabilized in 1.88 stable but absent from
# the older `nightly-2025-04-04` that was the previous system default.
#
# Scope: this file is read by rustup, so it pins the toolchain for LOCAL
# contributors only. CI (.github/workflows/ci.yml) installs its toolchain via
# `dtolnay/rust-toolchain` on the stable branch and passes `components:
# rustfmt, clippy` to that step directly — it does NOT consume this pin or
# the components list below, so local and CI builds can diverge by a few
# stable releases. With CI's `-Dwarnings` lints, a newer-stable-only lint
# can fail CI while passing locally on the pinned 1.90.0; if that bites,
# either bump this pin or teach CI to honor it (e.g. switch to
# actions-rust-lang/setup-rust-toolchain, which reads this file).
#
# To use a newer stable, bump this version (MSRV 1.88 still applies). To
# develop on nightly instead, replace `channel` with the desired nightly
# date after verifying it builds this crate graph.

[toolchain]
channel = "1.90.0"
# Auto-install pulls these in too; without them a fresh local environment
# gets a minimal toolchain and `cargo fmt --check` fails on a missing
# cargo-fmt (CI installs its own components, see above).
components = ["rustfmt", "clippy"]
